name: release
# Push a tag vX.Y.Z (matching .claude-plugin/plugin.json): this creates the GitHub release from the
# CHANGELOG section of that version, marks it Latest, and moves the `latest` tag to it. Install commands
# point at `latest`, so users get the newest release while `main` keeps moving.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag matches the plugin version, notes from the CHANGELOG
        run: |
          python - "${GITHUB_REF_NAME#v}" <<'PY'
          import json, re, sys, pathlib
          v = sys.argv[1]
          m = json.loads(pathlib.Path('.claude-plugin/plugin.json').read_text())['version']
          assert m == v, f'tag v{v} does not match plugin.json version {m}'
          text = pathlib.Path('CHANGELOG.md').read_text()
          sec = re.search(rf'^## {re.escape(v)}\b.*?$\n(.*?)(?=^## |\Z)', text, re.S | re.M)
          assert sec, f'no "## {v}" section in CHANGELOG.md'
          pathlib.Path('notes.md').write_text(sec.group(1).strip() + '\n\nInstall or update: see the [README](https://github.com/jjmartres/astroagent#install).\n')
          PY
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "astroagent $GITHUB_REF_NAME" --notes-file notes.md --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "astroagent $GITHUB_REF_NAME" --notes-file notes.md --latest --verify-tag
          fi
      - name: Move the latest tag
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
