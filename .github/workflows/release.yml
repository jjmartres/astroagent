name: release
# Cuts a release from the version in .claude-plugin/plugin.json:
#   - on a push to main that changes plugin.json (a version bump) or this file, when that version has no release yet;
#   - when run by hand (Actions → release → Run workflow), which also refreshes an existing release;
#   - on a pushed vX.Y.Z tag, which must match plugin.json.
# It creates the tag vX.Y.Z on the commit, the GitHub release with the CHANGELOG section of that version,
# marks it Latest, and moves the `latest` tag to it. Install commands point at `latest`.
on:
  push:
    branches: [main]
    paths: [".claude-plugin/plugin.json", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version and notes
        id: v
        run: |
          python - <<'PY'
          import json, os, re, pathlib
          v = json.loads(pathlib.Path('.claude-plugin/plugin.json').read_text())['version']
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              assert ref == f'refs/tags/v{v}', f'{ref} does not match plugin.json version {v}'
          text = pathlib.Path('CHANGELOG.md').read_text()
          sec = re.search(rf'^## {re.escape(v)}\b.*?$\n(.*?)(?=^## |\Z)', text, re.S | re.M)
          assert sec, f'no "## {v}" section in CHANGELOG.md'
          pathlib.Path('notes.md').write_text(sec.group(1).strip() + '\n\nInstall or update: see the [README](https://github.com/jjmartres/astroagent#install).\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'tag=v{v}\n')
          PY
      - name: Release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
              echo "$TAG is already released; bump the version in plugin.json to cut a new one"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release edit "$TAG" --title "astroagent $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "astroagent $TAG" --notes-file notes.md --latest
          fi
      - name: Move the latest tag
        if: steps.rel.outputs.skip != 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git fetch --tags --force
          git tag -f latest "$(git rev-list -n 1 "$TAG")"
          git push -f origin refs/tags/latest
